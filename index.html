<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Al Amal Medical Group – daily allergy, asthma and Ghibli dust-storm bulletin for Libyan cities.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<title>Amal AirWatch · Al Amal Medical Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ===== Al Amal Group identity: wave-blue mark, deep navy, white, sticker red for alerts ===== */
:root{
  --amal:#064c86; --amal-2:#2f7cc4; --navy:#053a68; --navy-deep:#03284a; --sky:#e6f0fb; --sky-2:#f3f8fe; --amal-red:#d32f2f;
  --ground:#f4f7fb; --surface:#ffffff; --surface-2:#f2f6fb; --line:#d9e3ef;
  --ink:#0f2440; --ink-2:#4a5c78; --ink-3:#7f8fa8;
  --accent:var(--amal); --accent-2:var(--amal-2); --accent-deep:var(--navy); --accent-soft:var(--sky);
  --gold:#f2b84b; --dust:#c27e22; --dust-soft:#f9edd9;
  --ok:#1e8a4c; --mod:#c48a06; --high:#e0641f; --vhigh:var(--amal-red);
  --ok-bg:#e2f4e8; --mod-bg:#fbf1cf; --high-bg:#fde4d3; --vhigh-bg:#fbe0e0;
  --shadow:0 1px 2px rgba(13,59,122,.05),0 10px 30px -12px rgba(13,59,122,.18);
  --shadow-lg:0 24px 60px -20px rgba(13,59,122,.35);
  --map-land:#e1e9f3; --map-sea:#cfe2f7; --on-accent:#ffffff;
  --f-display:"Cairo","Manrope",system-ui,sans-serif;
  --f-body:"Manrope","Cairo","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0a1526; --surface:#111f36; --surface-2:#172742; --line:#27395a; --sky:#173259; --sky-2:#132a4c;
    --ink:#e7eef9; --ink-2:#aebbd1; --ink-3:#7f8fa8;
    --amal:#5aa0ee; --amal-2:#7fb8f5; --navy:#c9dcf6; --navy-deep:#0d3b7a;
    --accent:var(--amal); --accent-2:var(--amal-2); --accent-deep:#0d3b7a; --accent-soft:#173259;
    --dust:#e3a74f; --dust-soft:#3a2c17;
    --ok:#5cc28c; --mod:#e5bb3a; --high:#f08a55; --vhigh:#f06a60;
    --ok-bg:#15332a; --mod-bg:#3a3214; --high-bg:#3d2418; --vhigh-bg:#40201e;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.6);
    --map-land:#1b2c47; --map-sea:#0f1f38; --on-accent:#0a1526;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0a1526; --surface:#111f36; --surface-2:#172742; --line:#27395a; --sky:#173259; --sky-2:#132a4c;
  --ink:#e7eef9; --ink-2:#aebbd1; --ink-3:#7f8fa8;
  --amal:#5aa0ee; --amal-2:#7fb8f5; --navy:#c9dcf6; --navy-deep:#0d3b7a;
  --accent:var(--amal); --accent-2:var(--amal-2); --accent-deep:#0d3b7a; --accent-soft:#173259;
  --dust:#e3a74f; --dust-soft:#3a2c17;
  --ok:#5cc28c; --mod:#e5bb3a; --high:#f08a55; --vhigh:#f06a60;
  --ok-bg:#15332a; --mod-bg:#3a3214; --high-bg:#3d2418; --vhigh-bg:#40201e;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.5); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.6);
  --map-land:#1b2c47; --map-sea:#0f1f38; --on-accent:#0a1526;
}
[lang="ar"]{--f-display:"Cairo",system-ui,sans-serif;--f-body:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;background:var(--ground)}
.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:22px;font-family:var(--f-body)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.3rem;font-weight:700;color:var(--navy)}
h3{font-size:1rem;font-family:var(--f-body);font-weight:700}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,g[data-city]:focus-visible{outline:2px solid var(--amal);outline-offset:2px}
.eyebrow{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
[lang="ar"] .eyebrow{letter-spacing:0;font-size:.78rem}
.ltr{direction:ltr}

/* ---------- top bar + hero band ---------- */
.mast{display:flex;flex-direction:column;gap:0;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);background:var(--surface)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 22px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line)}
.sticker{display:inline-flex;align-items:center;gap:12px;color:var(--navy)}
.sticker img{height:48px;width:auto;display:block}
.sticker b{display:block;font-family:"Cairo",sans-serif;font-size:1.15rem;line-height:1.1;color:var(--navy);font-weight:800}
.sticker small{display:block;font-size:.72rem;color:var(--amal);letter-spacing:.1em;text-transform:uppercase;font-weight:800;border-inline-start:2px solid var(--line);padding-inline-start:12px}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.pill.live{color:var(--ok);background:var(--ok-bg);border-color:transparent}.pill.sample{color:var(--dust);background:var(--dust-soft);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:700;font-size:.86rem;color:var(--navy);transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:hover{border-color:var(--amal);color:var(--amal);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(135deg,var(--amal-2),var(--amal));color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px var(--amal)}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}
.btn.sm{padding:5px 11px;font-size:.78rem;border-radius:10px}
.hero{position:relative;padding:34px 30px 60px;color:#fff;background:linear-gradient(110deg,var(--navy-deep) 0%,var(--navy) 45%,#1b5fb4 100%);overflow:hidden;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:26px 22px 54px}}
.hero .eyebrow{color:rgba(255,255,255,.7)}
.hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;margin-top:6px;color:#fff;font-family:"Cairo",sans-serif}
.hero h1 span{color:#9ecbff}
.hero .tag{color:rgba(255,255,255,.85);font-size:1rem;max-width:58ch;margin-top:10px}
.hero .waves{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:56px;display:block}
.hero .orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(158,203,255,.45),transparent 65%);filter:blur(30px);pointer-events:none}
.hero .orb.a{width:420px;height:420px;inset:-200px -120px auto auto}
.hero .orb.b{width:300px;height:300px;inset:auto auto -180px -80px}
.hero-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px)}
.kpi span{display:block;font-size:.7rem;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
[lang="ar"] .kpi span{letter-spacing:0;font-size:.76rem}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;line-height:1.2;margin-top:2px}
.kpi small{font-size:.72rem;opacity:.85}
.mast .btn{color:var(--navy)}

/* ---------- alert ---------- */
.alert{display:flex;gap:14px;align-items:flex-start;border-radius:16px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--amal-red);box-shadow:var(--shadow)}
.alert svg{flex:none;color:var(--amal-red)}
.alert strong{color:var(--amal-red)}
.alert p{font-size:.93rem}

/* ---------- section headers ---------- */
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-inline-start:14px;position:relative}
.section-title::before{content:"";position:absolute;inset-inline-start:0;top:.25em;width:5px;height:1.1em;border-radius:3px;background:linear-gradient(var(--amal-2),var(--navy))}
.section-title h2{font-size:1.5rem;font-weight:800}
.section-title p{color:var(--ink-3);font-size:.86rem}

/* ---------- overview city cards ---------- */
.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.overview{grid-template-columns:1fr}}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ccard.storm{border-color:var(--amal-red);box-shadow:0 0 0 4px var(--vhigh-bg),var(--shadow)}
.ccard .chead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(110deg,var(--navy),#1b5fb4)}
.ccard .chead::after{content:"";position:absolute;inset:auto -60px -160px auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(158,203,255,.45),transparent 65%);pointer-events:none}
.ccard.storm .chead{background:linear-gradient(110deg,#8e1c1c,var(--amal-red))}
.ccard .chead h2{color:#fff;font-size:1.45rem;font-weight:800;font-family:"Cairo",sans-serif}
.ccard .chead small{display:block;font-size:.72rem;opacity:.8;margin-top:1px}
.ccard .now{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.ccard .now .wi{width:46px;height:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.ccard .rt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1}
.ccard .tmp{font-family:var(--f-mono);font-size:1.9rem;line-height:1;font-weight:500}
.ccard .tmp small{font-size:.9rem;opacity:.75}
.ccard .chead .btn{background:#fff;border-color:#fff;color:var(--navy)}
.stormtag{background:#fff;color:var(--amal-red);border-radius:8px;padding:3px 9px;font-size:.7rem;font-weight:800}
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:12px}
.dcol{border:1px solid var(--line);border-radius:16px;padding:0 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;background:var(--surface);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.dcol:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--amal)}
.dcol[aria-pressed="true"]{border-color:var(--amal);box-shadow:0 0 0 3px color-mix(in srgb,var(--amal) 20%,transparent)}
.dcol.storm{background:var(--vhigh-bg);border-color:var(--amal-red)}
.dcol .dn{width:100%;background:var(--amal);color:#fff;font-size:.8rem;font-weight:800;padding:5px 2px 1px}
.dcol.storm .dn{background:var(--amal-red)}
.dcol .dd{width:100%;background:var(--amal);color:rgba(255,255,255,.85);font-size:.6rem;font-family:var(--f-mono);padding:0 0 5px;margin-top:-3px}
.dcol.storm .dd{background:var(--amal-red)}
.dcol .wi{width:40px;height:40px;margin:6px 0 2px}
.dcol .tt{font-family:var(--f-mono);font-size:1rem;line-height:1.1}
.dcol .tt b{color:var(--amal-red);font-weight:500;font-size:1.15rem}
.dcol .tt span{color:var(--ink-3);font-size:.76rem}
.dcol .kv{width:100%;display:flex;flex-direction:column;gap:2px;margin-top:6px;border-top:1px dashed var(--line);padding:6px 4px 0}
.dcol .kv div{display:flex;justify-content:space-between;font-size:.66rem;color:var(--ink-2);padding-inline:3px}
.dcol .kv div b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.dcol .rp{width:calc(100% - 8px);border-radius:10px;padding:4px 2px;font-size:.64rem;font-weight:700;line-height:1.2;margin-top:4px}
.dcol .rp span{display:block;font-size:.82rem}

/* ---------- panels ---------- */
.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid-main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-head p{color:var(--ink-3);font-size:.82rem}

.hero-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.hero-g{grid-template-columns:1fr}}
.gauge{border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--sky-2);border:1px solid var(--line);position:relative}
.gauge .label{grid-column:1/-1;font-size:.8rem;color:var(--navy);font-weight:800}
.ring{--v:0;--c:var(--ok);width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--f-mono);font-size:1.6rem;font-weight:500;line-height:1}
.ring small{position:relative;font-size:.62rem;color:var(--ink-3);margin-top:-2px}
.gauge .side{display:flex;flex-direction:column;gap:6px}
.gauge .why{font-size:.78rem;color:var(--ink-2)}
.level{align-self:flex-start;font-size:.76rem;font-weight:800;border-radius:8px;padding:3px 9px;white-space:nowrap}
.lv-0{color:var(--ok);background:var(--ok-bg)}.lv-1{color:var(--mod);background:var(--mod-bg)}.lv-2{color:var(--high);background:var(--high-bg)}.lv-3{color:var(--vhigh);background:var(--vhigh-bg)}
.bg-0{background:var(--ok)}.bg-1{background:var(--mod)}.bg-2{background:var(--high)}.bg-3{background:var(--vhigh)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.rose{width:86px;height:86px}
.gauge .ghv{font-family:var(--f-display);font-size:1.15rem;font-weight:800;line-height:1.1;color:var(--navy)}

.readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.reading{border-radius:12px;background:var(--sky-2);padding:8px 10px;display:flex;flex-direction:column;border-inline-start:3px solid var(--amal)}
.reading span{font-size:.72rem;color:var(--ink-3)}
.reading b{font-family:var(--f-mono);font-weight:500;font-size:1.08rem}
.reading b small{font-size:.68rem;color:var(--ink-3);font-family:var(--f-body)}
.reading.warn{border-color:var(--amal-red);background:color-mix(in srgb,var(--vhigh-bg) 55%,var(--sky-2))}
.reading em{font-style:normal;font-size:.68rem;color:var(--amal-red);font-weight:700}

.hourly{display:flex;flex-direction:column;gap:6px;background:var(--sky-2);border-radius:14px;padding:12px;border:1px solid var(--line)}
.hourly .hh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--ink-2)}
.hourly .hh b{color:var(--navy)}
.hbars{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:48px;align-items:end}
.hbars i{display:block;border-radius:4px 4px 2px 2px;min-height:4px;opacity:.9}
.hbars i.win{outline:2px solid var(--navy);outline-offset:-1px;opacity:1}
.hlabels{display:grid;grid-template-columns:repeat(24,1fr);font-size:.6rem;color:var(--ink-3);font-family:var(--f-mono)}
.hlabels span:nth-child(3n+2),.hlabels span:nth-child(3n+3){visibility:hidden}

.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:420px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.map svg{width:100%;height:auto;display:block;border-radius:14px}
.map text{font-family:var(--f-body)}

.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;flex-wrap:wrap}
.tab{flex:1 1 auto;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;font-size:.88rem;color:var(--ink-2);transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:0 6px 16px -8px var(--navy)}
.advice{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.advice li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:.93rem;max-width:85ch;align-items:start}
.advice li svg{width:22px;height:22px;padding:3px;border-radius:7px;background:var(--sky);color:var(--amal)}
.advice li.flag svg{background:var(--vhigh-bg);color:var(--amal-red)}
.note{font-size:.78rem;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:10px}
.muted{color:var(--ink-3);font-size:.8rem}

.hcp{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin-top:8px}
[lang="ar"] .hcp{letter-spacing:0;font-size:.8rem}
.hcp::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--amal)}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.products{grid-template-columns:1fr}}
.product{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.product:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.product .shot{background:#fff;border-bottom:1px solid var(--line);height:230px;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.product .shot img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;transition:transform .25s}
.product:hover .shot img{transform:scale(1.04)}
.product .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.product h3{font-family:var(--f-display);font-size:1.15rem;font-weight:800;color:var(--navy)}
.product .inn{font-size:.78rem;color:var(--ink-3)}
.product p{font-size:.86rem;color:var(--ink-2)}
.dose{font-size:.8rem;color:var(--ink-2);display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:8px}
.dose b{color:var(--navy);font-weight:800}
.product .rel{margin-top:auto;border-radius:12px;padding:9px 11px;font-size:.8rem;display:flex;flex-direction:column;gap:2px}
.product .rel b{font-size:.82rem}
.rel.r0{background:var(--ok-bg)}.rel.r1{background:var(--mod-bg)}.rel.r2{background:var(--high-bg)}.rel.r3{background:var(--vhigh-bg)}
.authentic{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:2px solid var(--amal-red);border-radius:16px;padding:10px 16px;color:var(--navy);box-shadow:var(--shadow)}
.authentic img{height:58px;width:auto;border-radius:10px;max-width:100%}
.authentic p{font-size:.85rem;color:var(--ink-2);max-width:60ch}
.contact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sky-2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.88rem}

details.method{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}

const imgs={};
function preloadImgs(){["logo","aerius","aerius2","nasonex","singulair","banner"].forEach(k=>{if(!ASSETS[k])return;const im=new Image();im.onload=()=>drawCard();im.src=ASSETS[k];imgs[k]=im;});}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawImgFit(g,im,x,y,w,h){
  if(!im||!im.complete||!im.naturalWidth)return;
  // التصميم الجديد: يملأ الصورة ليكون حجمها ضخم وبارز و متساوي قدر الإمكان
  const r=Math.min(w/im.naturalWidth,h/im.naturalHeight);
  const iw=im.naturalWidth*r,ih=im.naturalHeight*r;
  g.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}
function drawCard(){
  const cv=$("card"),g=cv.getContext("2d"),W=1080,H=1500,ar=state.lang==="ar";
  const c=cityOf(state.city),days=state.data[state.city],ixs=days.map(indices),f=F();
  const storm=ixs.some(x=>x.gh===2);
  const COL=["#1e8a4c","#c48a06","#e0641f","#d32f2f"],BG=["#e2f4e8","#fbf1cf","#fde4d3","#fbe0e0"];
  const fb=ar?"'Cairo', Tahoma, sans-serif":"'Manrope', sans-serif";
  const fd="'Cairo', sans-serif";
  g.direction=ar?"rtl":"ltr";g.textAlign="center";
  
  // background
  const grd=g.createLinearGradient(0,0,0,H);if(storm){grd.addColorStop(0,"#8e1c1c");grd.addColorStop(1,"#4a0e0e");}else{grd.addColorStop(0,"#1b5fb4");grd.addColorStop(1,"#082a58");}
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  g.fillStyle="rgba(255,255,255,.07)";for(let i=0;i<60;i++){g.beginPath();g.arc((i*137)%W,(i*211)%H,2+(i%6),0,7);g.fill();}
  
  // header
  g.fillStyle="#fff";g.font=`700 88px ${fd}`;g.fillText(cname(c),W/2,150);
  g.fillStyle="rgba(255,255,255,.75)";g.font=`600 24px ${fb}`;g.fillText(t("cardHead"),W/2,196);
  if(storm){g.fillStyle="#fff";roundRect(g,W/2-300,220,600,54,27);g.fill();g.fillStyle="#b3261e";g.font=`800 30px ${fb}`;g.fillText("⚠ "+t("cardStorm"),W/2,258);}
  drawSticker(g,ar?40:W-40-260,36,260,80);
  
  // columns
  const top=300,colW=196,gap=10,x0=(W-(colW*5+gap*4))/2,colH=740;
  days.forEach((d,i)=>{
    const ix=ixs[i];const xi=ar?4-i:i;const x=x0+xi*(colW+gap);
    g.fillStyle=ix.gh===2?"rgba(255,220,215,.96)":"rgba(255,255,255,.94)";roundRect(g,x,top,colW,colH,22);g.fill();
    g.fillStyle=ix.gh===2?"#d32f2f":"#1b5fb4";roundRect(g,x+10,top+10,colW-20,74,16);g.fill();
    g.fillStyle="#fff";g.font=`700 24px ${fb}`;g.fillText(dayShort(i,d.date),x+colW/2,top+44);g.font="500 16px 'IBM Plex Mono', monospace";g.fillText(d.date,x+colW/2,top+70);
    const im=iconImgs[iconFor(d,ix)];if(im&&im.complete)g.drawImage(im,x+colW/2-40,top+96,80,80);
    g.textAlign="right";g.fillStyle="#d32f2f";g.font="500 44px 'IBM Plex Mono', monospace";g.fillText(Math.round(d.tmax)+"°",x+colW/2+18,top+228);
    g.textAlign="left";g.fillStyle="#7b8d92";g.font="500 24px 'IBM Plex Mono', monospace";g.fillText("/ "+Math.round(d.tmin)+"°",x+colW/2+26,top+228);g.textAlign="center";
    g.strokeStyle="#d5dee0";g.beginPath();g.moveTo(x+18,top+250);g.lineTo(x+colW-18,top+250);g.stroke();
    const kv=t("kv");const rows=[[kv.hum,Math.round(d.hum)+"%"],[kv.wind,Math.round(d.windMax)],[kv.dust,Math.round(d.dust)],[kv.pollen,ix.pollen],[kv.uv,fmt(d.uv,0)]];
    rows.forEach((r,k)=>{const y=top+284+k*38;g.textAlign=ar?"right":"left";g.fillStyle="#4a5f66";g.font=`600 19px ${fb}`;g.fillText(r[0],ar?x+colW-18:x+18,y);g.textAlign=ar?"left":"right";g.fillStyle="#10242c";g.font="500 21px 'IBM Plex Mono', monospace";g.fillText(String(r[1]),ar?x+18:x+colW-18,y);});
    g.textAlign="center";
    const pillBox=(y,label,val)=>{const l=lvl(val);g.fillStyle=BG[l];roundRect(g,x+12,y,colW-24,104,14);g.fill();g.strokeStyle=COL[l];g.lineWidth=2;g.stroke();g.lineWidth=1;g.fillStyle="#4a5f66";g.font=`600 19px ${fb}`;g.fillText(label,x+colW/2,y+32);g.fillStyle=COL[l];g.font=`800 26px ${fb}`;g.fillText(FACE[l]+" "+t("levels")[l],x+colW/2,y+76);};
    pillBox(top+498,t("allergyShort"),ix.allergy);pillBox(top+618,t("asthmaShort"),ix.asthma);

  // ==========================================

  // حساب المساحات للأربع أدوية ليكونوا بنفس الحجم وبتوزيع متساوٍ
  const numItems = 4;
  const paddingX = 60; // المسافة من الحواف
  const availableWidth = W - (paddingX * 2); 
  const gapBetween = 25; // مسافة بين كل صورة والثانية
  const itemWidth = (availableWidth - (gapBetween * (numItems - 1))) / numItems; // حوالي 220 بكسل لكل دواء
  const itemHeight = 260; // ارتفاع كبير لبروز الأدوية

  // دالة لحساب موضع X لكل صورة

function drawSticker(g,x,y,w,h){

  if(/highest|worst|risk|أعلى|أين|اين|الخطر/.test(q))return (ar?"ترتيب المدن حسب الخطر:\n":"Cities ranked by risk:\n")+all.map((x,i)=>`${i+1}. ${cname(x.k)}: ${peak(x.ix)} ${FACE[lvl(peak(x.ix))]} ${L(peak(x.ix))}`).join("\n");
  if(/ghibli|dust|storm|قبلي|غبار|عاصفة/.test(q)){const h=CITIES.flatMap(k=>state.data[k.id].map((dd,i)=>({k,i,dd,x:indices(dd)})).filter(z=>z.x.gh));return h.length?(ar?"القبلي المتوقع:\n":"Expected Ghibli:\n")+h.map(z=>`• ${cname(z.k)}: ${dayLabel(z.i,z.dd.date)} (${Math.round(z.dd.dust)} µg/m³, ${Math.round(z.dd.windMax)} km/h)`).join("\n"):(ar?"لا يوجد قبلي متوقع خلال الأيام الخمسة.":"No Ghibli expected in the next five days.");}
  if(/explain|index|indices|guide|who|اشرح|مؤشر|دليل/.test(q))return ar?"مؤشر الحساسية: احتمال تهيّج الأنف والجيوب من الغبار والجسيمات واللقاح والرياح والجفاف.\nخطر الربو: احتمال تحفيز ضيق التنفس من الجسيمات الدقيقة والأوزون وتطرف الرطوبة والحرارة.\nالمقياس ٠–١٠٠: 😊 أقل من ٢٥ منخفض، 😐 ٢٥–٤٩ متوسط، 😷 ٥٠–٧٤ مرتفع، 🚨 ٧٥ فأكثر مرتفع جداً.\nالمرجعية: حدود منظمة الصحة العالمية لجودة الهواء ٢٠٢١.":"Allergy index: likelihood of nasal and sinus irritation from dust, particles, pollen, wind and dry air.\nAsthma risk: likelihood of triggering breathlessness from fine particles, ozone, humidity extremes and heat.\nScale 0–100: 😊 under 25 Low, 😐 25–49 Moderate, 😷 50–74 High, 🚨 75+ Very high.\nReference: WHO Air Quality Guidelines 2021.";
  if(/asthma|advice|patient|ربو|نصائح|مريض/.test(q))return adv().patient(d,ix).map(x=>"• "+x[0]).join("\n");
  if(/stock|inventory|demand|sales|نخزن|نخزّن|مخزون|طلب|مبيعات/.test(q)){state.aud="commercial";renderAudience();return (ar?"فتحت تبويب المبيعات والمخزون. ذروة الخطر بالفرع: ":"I've opened the Sales & Inventory tab. Peak risk by branch: ")+CITIES.filter(k=>k.branch).map(k=>`${cname(k)} ${state.data[k.id].map(indices).reduce((m,x)=>Math.max(m,peak(x)),0)}`).join(sep)+".";}
  return (ar?"أستطيع الإجابة عن: ملخص اليوم، المدن الأعلى خطراً، مواعيد القبلي، شرح المؤشرات، جرعات Aerius وNasonex وSingulair، أماكن توفر الأدوية، وإشارات المخزون.\n":"I can help with: today's summary, highest-risk cities, Ghibli timing, the indices, Aerius/Nasonex/Singulair dosing, where to find genuine products, and stock signals.\n")+contactLine();
}
function linkify(txt){const e=txt.replace(/[&<>]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));return e.replace(CONTACT.phone,`<a href="${CONTACT.wa}" target="_blank" rel="noopener">${CONTACT.phone}</a>`);}
async function answer(q){
  if(!q)return;addMsg(q,"me");
  const quick=ruleAnswer(q);const m=addMsg(null,"bot",linkify(quick));
  if(!sampleFn)return;
  let done=false;const ctl=new AbortController();setTimeout(()=>{if(!done)ctl.abort();},25000);
  const prompt=`You are the "Amal Medical Assistant" for Al Amal Medical Group in Libya (Organon's agent), serving physicians, pharmacists and the sales team. Answer in ${state.lang==="ar"?"Arabic":"English"}, as short bullet points (3–6 lines), professional tone.
Rules: never diagnose individuals. Dosing must match this approved guide exactly: ${PRODUCTS.map(p=>p.name+": "+p.en.dose.join("; ")).join(" | ")}. Genuine products are available only through Al Amal's accredited pharmacies; packs carry the "الأصلي" sticker with QR code, hotline ${CONTACT.hotline}. For contact, product availability, or anything you don't know, direct to ${CONTACT.name.en}, WhatsApp ${CONTACT.phone}. For red flags (breathlessness at rest, difficulty speaking, blue lips) advise emergency care immediately. Use only the data below; never invent figures. Data source: ${state.live?"live from Open-Meteo":"sample data for preview"}.
Selected city: ${cityOf(state.city).en}; selected day index: ${state.day} (0 = today).
Data: ${JSON.stringify(contextJSON())}
Question: ${q}`;
  try{const r=await sampleFn(prompt,{modelTier:"quick",cache:false,signal:ctl.signal,onText:({text})=>{if(text)m.innerHTML=linkify(text);$("msgs").scrollTop=$("msgs").scrollHeight;}});if(r&&r.text)m.innerHTML=linkify(r.text);}
  catch(e){if(e&&e.code==="not_granted"){sampleFn=null;$("aiMode").textContent=t("modeQuick");}if(!m.textContent.trim())m.innerHTML=linkify(quick);}
  finally{done=true;}
}

/* ============ wiring ============ */
function renderAll(){renderStatic();renderOverview();renderHero();renderMap();renderBanner();renderAudience();renderCompare();renderPersonal();drawCard();}
function pick(city,day,scroll){state.city=city;if(day!=null)state.day=day;renderAll();if(scroll)$("detailAnchor").scrollIntoView({behavior:"smooth",block:"start"});}
document.addEventListener("click",e=>{
  if(e.target.closest("#chat"))return;
  const sh=e.target.closest("[data-share]");if(sh){pick(sh.dataset.share,null,false);$("card").scrollIntoView({behavior:"smooth",block:"center"});return;}
  const dc=e.target.closest(".dcol[data-city]");if(dc){pick(dc.dataset.city,+dc.dataset.day,true);return;}
  const chip=e.target.closest("[data-city]");if(chip){pick(chip.dataset.city,null,false);return;}
  const tab=e.target.closest(".tab");if(tab){state.aud=tab.dataset.aud;renderAudience();}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g[data-city]")){e.preventDefault();pick(e.target.dataset.city,null,false);}});
["pCond","pAge","pCtrl","pOut"].forEach(id=>$(id).addEventListener("change",renderPersonal));
$("refresh").addEventListener("click",load);
$("langBtn").addEventListener("click",()=>{state.lang=state.lang==="en"?"ar":"en";try{localStorage.setItem("aw-lang",state.lang);}catch(_){}$("msgs").innerHTML="";renderAll();});
function fallbackCopy(txt){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");$("cardMsg").textContent=t("copied");}catch(_){$("cardMsg").textContent=t("copyManual");}ta.remove();}
$("copyText").addEventListener("click",()=>{const txt=waText();try{navigator.clipboard.writeText(txt).then(()=>{$("cardMsg").textContent=t("copied");},()=>fallbackCopy(txt));}catch(_){fallbackCopy(txt);}});
let downloads=null;
$("saveCard").addEventListener("click",()=>{$("card").toBlob(async blob=>{const name=`amal-bulletin-${state.city}-${cur(state.city,0).date}-${state.lang}.png`;
  if(downloads){try{await downloads.save({filename:name,data:blob});$("cardMsg").textContent=t("saved");}catch(e){$("cardMsg").textContent=e&&e.code==="declined"?t("cancelled"):t("noSave");}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}},"image/png");});
$("fab").addEventListener("click",()=>{const open=$("chat").hidden;$("chat").hidden=!open;$("fab").setAttribute("aria-expanded",String(open));if(open&&!$("msgs").children.length)addMsg(t("welcome"),"bot");if(open)$("ask").focus();});
$("closeChat").addEventListener("click",()=>{$("chat").hidden=true;$("fab").setAttribute("aria-expanded","false");});
$("quick").addEventListener("click",e=>{const b=e.target.closest("button");if(b)answer(b.textContent);});
function sendQ(){const q=$("ask").value.trim();if(!q)return;$("ask").value="";answer(q);$("ask").focus();}
$("sendBtn").addEventListener("click",sendQ);
$("ask").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendQ();}});
if(window.claude&&window.claude.use){
  window.claude.use("sample").then(fn=>{if(fn){sampleFn=fn;$("aiMode").textContent=t("modeAI");}}).catch(()=>{});
  window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});
}
preloadIcons();preloadImgs();
state.data=sampleData();renderAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCard);
load();
})();
</script>
